# Schema for IDEA:
# $schema: https://schema.golem.cloud/app/golem/1.5.0/golem.schema.json
# Schema for vscode-yaml:
# yaml-language-server: $schema=https://schema.golem.cloud/app/golem/1.5.0/golem.schema.json

# Field reference: https://learn.golem.cloud/app-manifest#field-reference
# Creating HTTP APIs: https://learn.golem.cloud/invoke/making-custom-apis

manifestVersion: 1.5.0

app: nanashi-lab

environments:
  local:
    default: true
    server: local
    componentPresets: debug
  cloud:
    server: cloud
    componentPresets: release
components:
  nanashi-lab:golem-claw:
    dir: ""
    templates: ts

    # Component environment variables can reference system environment variables with minijinja syntax:
    #
    #   env:
    #     ENV_VAR_1: "{{ ENV_VAR_1 }}"
    #     RENAMED_VAR_2: "{{ ENV_VAR_2 }}"
    #     COMPOSED_VAR_3: "{{ ENV_VAR_3 }}-{{ ENV_VAR_4}}"
    #
    env:

secretDefaults:
  local:
    botToken: "REPLACE_WITH_TELEGRAM_BOT_TOKEN"
    geminiApiKey: "REPLACE_WITH_GEMINI_API_KEY"
    firecrawlApiKey: "REPLACE_WITH_FIRECRAWL_API_KEY"
    weatherApiKey: "REPLACE_WITH_OPENWEATHER_API_KEY"
    resendApiKey: "REPLACE_WITH_RESEND_API_KEY"
    resendFromEmail: "Golem Claw <bot@example.com>"
    webhookSecret: "REPLACE_WITH_WEBHOOK_SECRET"
  cloud:
    botToken: "REPLACE_WITH_TELEGRAM_BOT_TOKEN"
    geminiApiKey: "REPLACE_WITH_GEMINI_API_KEY"
    firecrawlApiKey: "REPLACE_WITH_FIRECRAWL_API_KEY"
    weatherApiKey: "REPLACE_WITH_OPENWEATHER_API_KEY"
    resendApiKey: "REPLACE_WITH_RESEND_API_KEY"
    resendFromEmail: "Golem Claw <bot@example.com>"
    webhookSecret: "REPLACE_WITH_WEBHOOK_SECRET"

httpApi:
  deployments:
    local:
      - domain: golem-claw.localhost:9006
        webhookUrl: http://golem-claw.localhost:9006
        agents:
          TelegramWebhookAgent: {}
    cloud:
      - domain: nanash-lab2.apps.golem.cloud
        webhookUrl: https://nanash-lab2.apps.golem.cloud
        agents:
          TelegramWebhookAgent: {}
